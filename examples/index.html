<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resource Calendar Test</title>
    <style>
      body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #f4f7f6;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }

      .calendar-card {
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        padding: 24px;
        width: 100%;
        max-width: 60vw;
      }
    </style>
  </head>
  <body>
    <main class="calendar-card">
      <header>
        <h2>Resource Calendar</h2>
      </header>

      <div id="container-resourcecalendar"></div>
    </main>

    <script type="module">
      import { ResourceCalendar } from "../src/index.ts";

      const options = {
        fetchResourcesFunction: () => ({
          1: "abc",
          2: "abc2",
          3: "abc3",
        }),
      };

      const calendar = new ResourceCalendar(
        "#container-resourcecalendar",
        options,
      );
      calendar.render();
    </script>
  </body>
</html>
